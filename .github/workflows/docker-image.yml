name: Docker imaji

on:
  push:
    tags:
      - 'docker-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Node.js'i hazirla
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Testleri calistir
        run: |
          npm ci
          npm test

      - name: Docker Buildx'i hazirla
        uses: docker/setup-buildx-action@v3

      - name: GitHub Container Registry'ye giris yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imaj etiketlerini hazirla
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Imaj olustur ve GHCR'ye gonder
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
