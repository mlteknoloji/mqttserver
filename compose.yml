services:
  mqttserver:
    image: ghcr.io/mlteknoloji/mqttserver:latest
    container_name: netrelay-mqtt-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      SECURITY_DB_PATH: /data/security.sqlite3
    ports:
      - "${MQTT_PORT:-1883}:${MQTT_PORT:-1883}"
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
      - "${MQTT_TLS_PORT:-8883}:${MQTT_TLS_PORT:-8883}"
      - "${WEB_HTTPS_PORT:-3443}:${WEB_HTTPS_PORT:-3443}"
    volumes:
      - mqttserver-data:/data
      - mqttserver-logs:/app/logs
      - mqttserver-firmware:/app/firmware-files
      - ./users.json:/app/users.json:ro

volumes:
  mqttserver-data:
  mqttserver-logs:
  mqttserver-firmware:
